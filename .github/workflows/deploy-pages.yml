name: Nasadenie na GitHub Pages

# Nasadzuje sa LEN z main.
#
# Prostredie `github-pages` má v predvolenom nastavení GitHubu ochranné
# pravidlo, ktoré púšťa nasadenie iba z predvolenej vetvy. Vývojová vetva sa
# preto úspešne zbuildí, ale deploy jej GitHub odmietne. Držíme sa toho
# pravidla: čo je na main, to je na webe.
#
# Ak by si chcel nasadzovať aj z vývojovej vetvy, treba to povoliť v
# Settings → Environments → github-pages → Deployment branches
# a vetvu dopísať sem do `branches`.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Súbežné nasadenia sa nemajú prebíjať; rozbehnutý build necháme dobehnúť.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` (nie `install`) — inštaluje presne to, čo je v package-lock.json,
      # takže build v CI zodpovedá tomu lokálnemu.
      - run: npm ci

      - name: Typová kontrola
        run: npm run check

      - name: Build
        env:
          # Project Pages bežia v podadresári podľa názvu repozitára. Bez toho
          # by všetky odkazy, CSS aj obrázky ukazovali do koreňa domény.
          SITE_URL: https://${{ github.repository_owner }}.github.io
          BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
